# RoofWatt minimal theme: neutral surfaces, one accent (solar orange), light and dark.
# No `base` is set, so the app follows the viewer's system setting; the theme selector is in the app menu
# (top right). Custom CSS lives in ui/styles.py and uses currentColor, so it needs no per-theme copy.
# Inter loads from Google Fonts and falls back to the bundled sans-serif offline.
[theme]
primaryColor = "#FF9F1C"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
baseFontSize = 17
baseRadius = "12px"
showWidgetBorder = true
showSidebarBorder = true
metricValueFontSize = "2rem"
metricValueFontWeight = 600
linkUnderline = true

[theme.light]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F7"
textColor = "#1D1D1F"
borderColor = "#E5E5EA"
linkColor = "#13294B"  # brand navy, used sparingly (14:1 on white)

[theme.light.sidebar]
backgroundColor = "#F5F5F7"
secondaryBackgroundColor = "#FFFFFF"

[theme.dark]
backgroundColor = "#000000"
secondaryBackgroundColor = "#1C1C1E"
textColor = "#F5F5F7"
borderColor = "#38383A"
linkColor = "#F5F5F7"

[theme.dark.sidebar]
backgroundColor = "#1C1C1E"
secondaryBackgroundColor = "#2C2C2E"

[client]
toolbarMode = "minimal"  # menu keeps only About + the theme selector
